version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hrm_postgres
    restart: always
    environment:
      POSTGRES_USER: hrm_user
      POSTGRES_PASSWORD: hrm_password_secure_2026
      POSTGRES_DB: hrm_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hrm_user -d hrm_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hrm_backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://hrm_user:hrm_password_secure_2026@db:5432/hrm_db?schema=public
      JWT_SECRET: hrm_enterprise_jwt_secret_key_at_least_32_characters_long_2026
      REFRESH_TOKEN_SECRET: hrm_enterprise_refresh_token_secret_key_2026_super_secure
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hrm_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
